name: Auto Version & Release

# On every push (excluding the bot's own release commits and any commit marked
# [skip ci]) this:
#   1. Computes the next version from the commit message (Conventional Commits)
#   2. Builds a release APK  (BEFORE tagging — a failed build cuts no release)
#   3. Bumps pubspec.yaml, commits, tags vX.Y.Z, pushes
#   4. Publishes a GitHub Release with the APK attached + auto-generated notes
#
#   feat: ...          -> minor bump   (0.1.0 -> 0.2.0)
#   fix: / chore: ...  -> patch bump   (0.1.0 -> 0.1.1)
#   ... with "!" or "BREAKING CHANGE" -> major bump (0.1.0 -> 1.0.0)
#
# The build number (the "+N" suffix in pubspec) always increments.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # so a failed build can report the error log back as an issue

jobs:
  release:
    runs-on: ubuntu-latest

    # Run on every push except the bot's own release bump or any [skip ci]
    # commit (so the workflow can't loop on itself).
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Versioning -------------------------------------------------------
      - name: Determine bump type from commit message
        id: bump
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"
          if echo "$MSG" | grep -qiE "BREAKING CHANGE|!:"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qiE "^feat(\(.+\))?:"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//')
          SEMVER="${CURRENT%%+*}"
          BUILD="${CURRENT##*+}"
          if [ "$BUILD" = "$CURRENT" ]; then BUILD=0; fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$SEMVER"
          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW_BUILD=$((BUILD+1))
          NEW_SEMVER="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${CURRENT} -> ${NEW_SEMVER}+${NEW_BUILD} (${{ steps.bump.outputs.type }})"
          echo "semver=${NEW_SEMVER}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_SEMVER}+${NEW_BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_SEMVER}" >> "$GITHUB_OUTPUT"

      - name: Stop if tag already exists
        id: guard
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Build (must succeed before we tag/release) -----------------------
      - name: Set up JDK 17
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.guard.outputs.skip == 'false'
        uses: subosito/flutter-action@v2
        with:
          # Pinned to match the 2024-era dependency + codegen matrix in
          # pubspec.yaml (Dart 3.5). Keep in sync if deps are bumped.
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Apply version bump to pubspec.yaml
        if: steps.guard.outputs.skip == 'false'
        run: |
          sed -i -E "s/^version:.*/version: ${{ steps.version.outputs.version }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Generate Android platform scaffold (if missing)
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [ ! -d android ]; then
            echo "No android/ folder — generating platform scaffold."
            flutter create --platforms=android --project-name project_monarch .
          fi

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: flutter pub get

      - name: Generate code (Hive adapters, etc.)
        if: steps.guard.outputs.skip == 'false'
        run: dart run build_runner build --delete-conflicting-outputs 2>&1 | tee codegen.log

      - name: Static analysis (non-fatal, for diagnostics)
        if: steps.guard.outputs.skip == 'false'
        run: flutter analyze 2>&1 | tee analyze.log || true

      - name: Build release APK
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Rename APK
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/project-monarch-${{ steps.version.outputs.tag }}.apk"
          ls -lh dist

      # --- Tag & release ----------------------------------------------------
      - name: Commit, tag & push
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit the version bump (android scaffold/generated files stay
          # untracked per .gitignore).
          git add pubspec.yaml
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release with APK
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Project Monarch ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            "dist/project-monarch-${{ steps.version.outputs.tag }}.apk"

      # --- Diagnostics: on ANY failure, report the error log as an issue so it
      #     can be read without access to the Actions run logs. ---------------
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated build failed for commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\`."
            echo
            echo "### flutter build apk (tail)"
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo "(no build.log — failed before build)"
            echo '```'
            echo "### flutter analyze (tail)"
            echo '```'
            tail -n 80 analyze.log 2>/dev/null || echo "(no analyze.log)"
            echo '```'
            echo "### build_runner (tail)"
            echo '```'
            tail -n 60 codegen.log 2>/dev/null || echo "(no codegen.log)"
            echo '```'
          } > _failure_report.md
          gh issue create \
            --title "CI build failure @ ${{ github.sha }}" \
            --body-file _failure_report.md \
            --label "ci" 2>/dev/null \
          || gh issue create \
            --title "CI build failure @ ${{ github.sha }}" \
            --body-file _failure_report.md

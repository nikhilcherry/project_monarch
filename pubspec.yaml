name: project_monarch
description: "Project Monarch — a gamified, offline-first premium fitness tracker inspired by the System from Solo Leveling."
publish_to: "none"

# version: <semantic>+<build_number>  (auto-bumped by the release workflow)
version: 0.2.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / Icons / Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1            # Orbitron/Rajdhani HUD typography

  # State Management — Riverpod (manual Notifiers, no codegen)
  flutter_riverpod: ^2.5.1

  # Local Database (Offline First) — Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Data Visualization
  fl_chart: ^0.68.0             # Pentagon radar chart (STR/AGI/VIT/END/FLEX)
  # (365-day heatmap is hand-painted in widgets/consistency_heatmap.dart —
  #  no third-party heatmap package needed.)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Codegen — only Hive TypeAdapters are generated.
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # No bundled assets yet — declare them here once added under assets/.
